services:
  # Backend 
  backend:
    container_name: backend_fitcoach_app
    image: backend_fitcoach_image
    build:
      context: ./backend
    restart: unless-stopped
    volumes:
      - ./backend:/app
      - ./schema_training_rts_ai.sql:/app/schema_training_rts_ai.sql:ro
    ports:
      - '127.0.0.1:5000:5000'
    environment:
      - DEBUG=${APP_DEBUG}
      - LOG_LEVEL=${LOG_LEVEL}
      - DATABASE_URL=postgres://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
    depends_on:
      - db
    networks:
      - fitcoach

  # Frontend 
  frontend:
    container_name: frontend_fitcoach_app
    image: frontend_fitcoach_image
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    volumes:
      - ./frontend:/app
      - /app/fitai-coach-cli/node_modules
    ports:
      - '127.0.0.1:3000:3000'
    environment:
      - CHOKIDAR_USEPOLLING=true
      - VITE_API_URL=http://localhost:5000/api
      - VITE_AI_URL=http://localhost:5005
    networks:
      - fitcoach

  # Base de datos PostgreSQL
  db:
    container_name: db_fitcoach_app
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_PORT=${DB_PORT}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./schema_training_rts_ai.sql:/docker-entrypoint-initdb.d/schema_training_rts_ai.sql:ro
    ports:
      - "5432:5432"
    networks:
      - fitcoach
      
  # FastAPI app (modelo + API)
  fastapi:
    container_name: fastapi_fitcoach_app
    build:
      context: ./fastapi-app
    image: docker-fitcoach-fastapi
    volumes:
      - ./backend:/app/backend:ro
    environment:
      - OLLAMA_SERVER_URL=http://ollama:11434
      - PYTHONPATH=/app/backend
    ports:
      - "5005:5005"
    depends_on:
      - ollama
    networks:
      - fitcoach

  # Ollama 
  ollama:
    image: ollama/ollama:latest
    container_name: ollama_fitcoach_app
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - fitcoach  

volumes:
  db_data:
  ollama_data:
networks:
  fitcoach:
    driver: bridge
